<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">{{ isEditing ? 'Edit Task' : 'Create New Task' }}</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
            <div class="alert alert-danger" *ngIf="error" role="alert">
              {{ error }}
            </div>

            <div class="mb-3">
              <label for="title" class="form-label">Task Title *</label>
              <input
                type="text"
                class="form-control"
                [class.is-invalid]="submitted && f['title'].errors"
                id="title"
                formControlName="title"
                placeholder="Enter task title"
              >
              <div class="invalid-feedback" *ngIf="submitted && f['title'].errors">
                <div *ngIf="f['title'].errors['required']">Task title is required</div>
                <div *ngIf="f['title'].errors['minlength']">Task title must be at least 3 characters</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description *</label>
              <textarea
                class="form-control"
                [class.is-invalid]="submitted && f['description'].errors"
                id="description"
                formControlName="description"
                placeholder="Enter task description"
                rows="4"
              ></textarea>
              <div class="invalid-feedback" *ngIf="submitted && f['description'].errors">
                <div *ngIf="f['description'].errors['required']">Description is required</div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="priority" class="form-label">Priority *</label>
                <select
                  class="form-select"
                  id="priority"
                  formControlName="priority"
                >
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label for="status" class="form-label">Status *</label>
                <select
                  class="form-select"
                  id="status"
                  formControlName="status"
                >
                  <option value="pending">Pending</option>
                  <option value="in-progress">In Progress</option>
                  <option value="completed">Completed</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="dueDate" class="form-label">Due Date *</label>
              <input
                type="datetime-local"
                class="form-control"
                [class.is-invalid]="submitted && f['dueDate'].errors"
                id="dueDate"
                formControlName="dueDate"
              >
              <div class="invalid-feedback" *ngIf="submitted && f['dueDate'].errors">
                <div *ngIf="f['dueDate'].errors['required']">Due date is required</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="assignedTo" class="form-label">
                {{ canAssignToOthers() ? 'Assign To' : 'Assign To (Self)' }} *
              </label>
              <select
                class="form-select"
                [class.is-invalid]="submitted && f['assignedTo'].errors"
                id="assignedTo"
                formControlName="assignedTo"
                [disabled]="!canAssignToOthers()"
              >
                <option *ngFor="let user of allUsers" [value]="user._id">
                  {{ user.username }} ({{ user.role }})
                </option>
              </select>
              <div class="invalid-feedback" *ngIf="submitted && f['assignedTo'].errors">
                <div *ngIf="f['assignedTo'].errors['required']">Please select a user</div>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="loading"
              >
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? (isEditing ? 'Updating...' : 'Creating...') : (isEditing ? 'Update Task' : 'Create Task') }}
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                (click)="router.navigate(['/dashboard'])"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
