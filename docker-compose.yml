version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: task-management-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - task-management-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-management-backend
    restart: always
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/task-management
      JWT_SECRET: your_super_secret_jwt_key
      PORT: 5000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:4200
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - task-management-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-management-frontend
    restart: always
    ports:
      - "4200:80"
    networks:
      - task-management-network

volumes:
  mongodb_data:

networks:
  task-management-network:
    driver: bridge
